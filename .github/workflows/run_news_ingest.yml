name: Ingest Live News & Update Database

on:
  schedule:
    - cron: '0 */6 * * *' # Automatically runs every 6 hours
  workflow_dispatch:       # Allows manual click from GitHub UI

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Run Live Ingestion Cycle
        run: |
          python run_news_cycle.py

      - name: Commit Updated News Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.db
          git commit -m "chore(data): sync latest news articles to sqlite fts [skip ci]" || echo "No new articles to commit"
          git push origin main
