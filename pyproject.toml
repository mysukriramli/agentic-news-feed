[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-news-feed"
version = "0.1.0"
description = "Autonomous real-time, paywall-free global news ingestion and retrieval engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "mcp[cli]<2",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
